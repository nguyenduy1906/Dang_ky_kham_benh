{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔐</div>
      <h1>Đăng nhập</h1>
      <p>Chào mừng bạn trở lại!</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email" id="email" name="email"
          placeholder="example@email.com"
          value="{{ request.form.get('email', '') }}"
          required autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-password">
          <input
            type="password" id="password" name="password"
            placeholder="Nhập mật khẩu"
            required autocomplete="current-password"
          />
          <button type="button" class="toggle-pw" onclick="togglePassword('password')">👁</button>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" name="remember" /> Ghi nhớ đăng nhập
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
    </form>

    <div class="auth-footer">
      Chưa có tài khoản?
      <a href="{{ url_for('auth.register') }}">Đăng ký ngay</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
