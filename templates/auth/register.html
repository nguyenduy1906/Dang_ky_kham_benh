{% extends "base.html" %}
{% block title %}Đăng ký tài khoản{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card auth-card-wide">
    <div class="auth-header">
      <div class="auth-icon">📋</div>
      <h1>Tạo tài khoản</h1>
      <p>Đăng ký miễn phí và bắt đầu đặt lịch khám</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" id="registerForm" novalidate>
      <div class="form-row-2">
        <div class="form-group">
          <label for="full_name">Họ và tên <span class="required">*</span></label>
          <input
            type="text" id="full_name" name="full_name"
            placeholder="Nguyễn Văn A"
            value="{{ request.form.get('full_name', '') }}"
            required
          />
        </div>
        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input
            type="tel" id="phone" name="phone"
            placeholder="0912345678"
            value="{{ request.form.get('phone', '') }}"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input
          type="email" id="email" name="email"
          placeholder="example@email.com"
          value="{{ request.form.get('email', '') }}"
          required
        />
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label for="password">Mật khẩu <span class="required">*</span></label>
          <div class="input-password">
            <input
              type="password" id="password" name="password"
              placeholder="Tối thiểu 6 ký tự"
              required minlength="6"
            />
            <button type="button" class="toggle-pw" onclick="togglePassword('password')">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm_password">Xác nhận mật khẩu <span class="required">*</span></label>
          <div class="input-password">
            <input
              type="password" id="confirm_password" name="confirm_password"
              placeholder="Nhập lại mật khẩu"
              required
            />
            <button type="button" class="toggle-pw" onclick="togglePassword('confirm_password')">👁</button>
          </div>
        </div>
      </div>

      <div class="password-strength" id="pwStrength"></div>

      <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>
    </form>

    <div class="auth-footer">
      Đã có tài khoản?
      <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
