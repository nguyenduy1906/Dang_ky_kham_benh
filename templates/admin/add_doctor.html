{% extends "base.html" %}
{% block title %}Thêm Bác Sĩ Mới{% endblock %}
{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
{% endblock %}

{% block content %}
<div class="dashboard-layout container">
  <aside class="sidebar">
    <div class="sidebar-user">
      <div class="sidebar-avatar">⚙️</div>
      <div>
        <strong>{{ current_user.full_name }}</strong>
        <span class="role-badge badge-admin">Quản trị</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="{{ url_for('admin.dashboard') }}" class="sidebar-link">📊 Tổng quan</a>
      <a href="{{ url_for('admin.doctors') }}" class="sidebar-link active">👨‍⚕️ Bác sĩ</a>
      <a href="{{ url_for('admin.patients') }}" class="sidebar-link">👥 Bệnh nhân</a>
      <a href="{{ url_for('auth.logout') }}" class="sidebar-link sidebar-logout">🚪 Đăng xuất</a>
    </nav>
  </aside>

  <div class="dashboard-main">
    <div class="dashboard-header">
      <h1>Thêm bác sĩ mới</h1>
      <a href="{{ url_for('admin.doctors') }}" class="btn btn-outline">← Quay lại</a>
    </div>

    <div class="card">
      <form method="POST" class="form-profile">
        <div class="form-row-2">
          <div class="form-group">
            <label>Họ và tên <span class="required">*</span></label>
            <input type="text" name="full_name" required placeholder="Nguyễn Văn A" />
          </div>
          <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input type="email" name="email" required placeholder="bac.si@clinic.vn" />
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>Số điện thoại</label>
            <input type="tel" name="phone" placeholder="0912345678" />
          </div>
          <div class="form-group">
            <label>Mật khẩu ban đầu <span class="required">*</span></label>
            <input type="password" name="password" required minlength="6" />
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>Chuyên khoa <span class="required">*</span></label>
            <input type="text" name="specialty" required placeholder="Tim mạch, Nội khoa, ..." />
          </div>
          <div class="form-group">
            <label>Số năm kinh nghiệm</label>
            <input type="number" name="experience_years" min="0" value="0" />
          </div>
        </div>
        <div class="form-group">
          <label>Phí khám (VNĐ)</label>
          <input type="number" name="consultation_fee" min="0" step="10000" value="0" />
        </div>
        <div class="form-group">
          <label>Giới thiệu</label>
          <textarea name="bio" rows="4" placeholder="Mô tả kinh nghiệm và chuyên môn của bác sĩ..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Tạo tài khoản bác sĩ</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
